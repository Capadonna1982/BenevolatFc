<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bénévolat — Équipe de football</title>
<style>
:root{
  --bg:#0f172a; --bg2:#1e293b; --surface:#ffffff; --surface2:#f8fafc;
  --line:#e2e8f0; --line2:#cbd5e1;
  --text:#0f172a; --muted:#64748b; --muted2:#94a3b8;
  --brand:#2563eb; --brand-dark:#1d4ed8; --brand-light:#dbeafe;
  --green:#16a34a; --green-light:#dcfce7;
  --amber:#d97706; --amber-light:#fef3c7;
  --red:#dc2626; --red-light:#fee2e2;
  --radius:14px; --radius-sm:10px;
  --shadow:0 1px 3px rgba(15,23,42,.08),0 1px 2px rgba(15,23,42,.06);
  --shadow-lg:0 10px 30px rgba(15,23,42,.12);
  --font:'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--surface2);color:var(--text);line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,select{font-family:inherit;font-size:14px}
a{color:var(--brand);text-decoration:none}
.hidden{display:none!important}

/* ---------- Auth screen ---------- */
#authScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#0f172a 0%,#1e3a8a 60%,#2563eb 100%);padding:20px}
.auth-card{background:var(--surface);border-radius:20px;box-shadow:var(--shadow-lg);
  width:100%;max-width:420px;padding:38px 34px;animation:pop .4s ease}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.auth-logo{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.auth-logo .ball{width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 30%,#111 55% 100%);
  box-shadow:0 4px 10px rgba(0,0,0,.25);flex:none;position:relative}
.auth-logo h1{font-size:20px;font-weight:800;letter-spacing:-.4px}
.auth-sub{color:var(--muted);font-size:13.5px;margin-bottom:24px}
.tabs{display:flex;background:var(--surface2);border-radius:12px;padding:4px;margin-bottom:22px}
.tabs button{flex:1;padding:9px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted);transition:.15s}
.tabs button.active{background:var(--surface);color:var(--brand);box-shadow:var(--shadow)}
.field{margin-bottom:15px}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:6px}
.field input,.field select{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:var(--radius-sm);
  transition:.15s;background:#fff}
.field input:focus,.field select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-light)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:var(--radius-sm);
  font-weight:600;font-size:14px;transition:.15s;white-space:nowrap}
.btn-primary{background:var(--brand);color:#fff}
.btn-primary:hover{background:var(--brand-dark)}
.btn-block{width:100%;padding:13px}
.btn-ghost{background:var(--surface2);color:var(--text);border:1.5px solid var(--line)}
.btn-ghost:hover{background:#eef2f7}
.btn-danger{background:var(--red-light);color:var(--red)}
.btn-danger:hover{background:#fecaca}
.btn-sm{padding:7px 12px;font-size:13px}
.btn-success{background:var(--green);color:#fff}
.btn-success:hover{background:#15803d}
.auth-err{background:var(--red-light);color:var(--red);padding:10px 13px;border-radius:9px;font-size:13px;margin-bottom:14px}
.auth-foot{text-align:center;margin-top:18px;font-size:12.5px;color:var(--muted2)}
.lang-switch{display:flex;gap:4px;justify-content:center;margin-top:16px}
.lang-switch button{padding:5px 12px;border-radius:8px;font-size:12px;font-weight:600;color:var(--muted);border:1px solid var(--line)}
.lang-switch button.active{background:var(--brand);color:#fff;border-color:var(--brand)}
.demo-hint{background:var(--amber-light);color:#92400e;padding:10px 12px;border-radius:9px;font-size:12px;margin-top:16px;line-height:1.6}

/* ---------- App shell ---------- */
#app{min-height:100vh;display:flex;flex-direction:column}
.topbar{background:var(--bg);color:#fff;display:flex;align-items:center;gap:16px;padding:0 20px;height:60px;position:sticky;top:0;z-index:50}
.topbar .ball{width:32px;height:32px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 30%,#111 55% 100%);flex:none}
.topbar .brand{font-weight:800;font-size:16px;letter-spacing:-.3px}
.logo-setting{display:flex;gap:16px;align-items:center}
.logo-preview{width:64px;height:64px;border-radius:50%;flex:none;background:radial-gradient(circle at 35% 30%,#fff 0 30%,#111 55% 100%);border:1px solid var(--border)}
.logo-setting-body{flex:1;min-width:0}
.track-name{display:flex;align-items:center;gap:10px}
.track-name.is-toggle{cursor:pointer;user-select:none;border-radius:8px;padding:2px 4px;margin:-2px -4px;transition:background .12s}
.track-name.is-toggle:hover{background:var(--brand-light)}
.pa-count{font-size:11px;font-weight:700;color:var(--muted);background:var(--line);border-radius:20px;padding:1px 8px}
.pa-list{margin:8px 0 2px 34px;display:flex;flex-direction:column;gap:5px}
.pa-item{display:flex;align-items:center;gap:8px;font-size:12.5px;flex-wrap:wrap}
.pa-dot{width:8px;height:8px;border-radius:50%;flex:none}
.pa-act{font-weight:600;color:var(--text)}
.pa-ev{color:var(--muted)}
.pa-badge{font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:20px;text-transform:uppercase;letter-spacing:.3px}
.pa-badge.past{background:#dcfce7;color:#166534}
.pa-badge.up{background:#dbeafe;color:#1e40af}
.pa-empty{margin:6px 0 2px 34px;font-size:12px;color:var(--muted);font-style:italic}
/* Rappels courriel */
.notice{background:#fff8e1;border:1px solid #ffe08a;color:#7a5c00;padding:8px 12px;border-radius:8px;font-size:13px;margin:8px 0}
.email-list{display:flex;flex-direction:column;gap:14px;margin:12px 0}
.email{border:1px solid var(--border);border-radius:10px;overflow:hidden;background:#fff}
.email-head{background:var(--panel2,#f6f8fb);padding:10px 14px;border-bottom:1px solid var(--border);font-size:13px;line-height:1.6}
.email-label{color:var(--muted);font-weight:600;margin-right:4px}
.email-body{padding:14px}
.email-body p{margin:0 0 10px}
.email-table{width:100%;border-collapse:collapse;margin:6px 0 10px}
.email-table th{text-align:left;vertical-align:top;width:150px;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--border);font-size:13px}
.email-table td{padding:6px 8px;border-bottom:1px solid var(--border);font-size:13px}
.integration{margin-top:14px;border:1px dashed var(--border);border-radius:10px;background:#fafbfe}
.integration summary{cursor:pointer;padding:10px 14px;font-weight:600}
.integration-body{padding:0 14px 12px}
.integration-body ol{margin:6px 0 6px 18px;line-height:1.6;font-size:14px}
.integration-body code{background:var(--line,#eef);padding:1px 5px;border-radius:4px;font-size:12px}
.outbox-item{border:1px solid var(--border);border-radius:8px;padding:8px 12px;margin-bottom:8px;font-size:13px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.act-desc{font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.4}
.need-chip-col{flex-direction:column;align-items:stretch;gap:6px}
.need-chip-row{display:flex;align-items:center;gap:8px}
.need-instr{width:100%;font-size:13px;padding:6px 8px;border:1px solid var(--border);border-radius:8px;background:var(--bg)}
.need-info-btn{margin-left:auto;background:transparent;border:1px solid var(--border);color:var(--muted);font-size:12px;padding:3px 9px;border-radius:20px;cursor:pointer}
.need-info-btn:hover{background:var(--surface-2);color:var(--fg)}
.instr-box{background:var(--surface-2,#f6f8fb);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin:6px 0 10px;display:flex;flex-direction:column;gap:10px}
.instr-blk .instr-h{font-weight:700;font-size:12.5px;color:var(--fg);margin-bottom:2px}
.instr-blk .instr-t{font-size:13.5px;color:var(--muted);line-height:1.5;white-space:pre-wrap}
.instr-empty{font-size:13px;color:var(--muted);margin:0;font-style:italic}
.detail-row td{background:var(--surface-2,#f6f8fb);padding:0 14px 4px!important}
.topbar .role-badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;text-transform:uppercase;letter-spacing:.5px}
.role-coach{background:#7c3aed;color:#fff}
.role-player{background:var(--brand);color:#fff}
.role-parent{background:#0891b2;color:#fff}
.topbar .spacer{flex:1}
.topbar .user-chip{display:flex;align-items:center;gap:9px;font-size:13.5px}
.avatar{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:12.5px;color:#fff;flex:none;letter-spacing:.3px}
.topbar .icon-btn{color:#cbd5e1;padding:7px 10px;border-radius:8px;font-size:13px;font-weight:600}
.topbar .icon-btn:hover{background:rgba(255,255,255,.1);color:#fff}

.layout{flex:1;display:flex;max-width:1200px;width:100%;margin:0 auto}
.sidebar{width:220px;padding:22px 14px;flex:none;position:sticky;top:60px;align-self:flex-start;height:calc(100vh - 60px);overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:11px;padding:11px 14px;border-radius:var(--radius-sm);
  font-weight:600;font-size:14px;color:var(--muted);width:100%;text-align:left;transition:.13s;margin-bottom:3px}
.nav-item:hover{background:#eef2f7;color:var(--text)}
.nav-item.active{background:var(--brand-light);color:var(--brand-dark)}
.nav-item .ico{font-size:17px;width:20px;text-align:center}
.content{flex:1;padding:26px 24px 60px;min-width:0}
.page-head{margin-bottom:22px}
.page-head h2{font-size:23px;font-weight:800;letter-spacing:-.5px}
.page-head p{color:var(--muted);font-size:14px;margin-top:3px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:18px}
.card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:12px;flex-wrap:wrap}
.card-head h3{font-size:16px;font-weight:700}
.grid{display:grid;gap:16px}
.grid-2{grid-template-columns:repeat(2,1fr)}
.grid-3{grid-template-columns:repeat(3,1fr)}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.stat .label{font-size:12.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.stat .value{font-size:30px;font-weight:800;margin-top:6px;letter-spacing:-1px}
.stat .value small{font-size:15px;color:var(--muted2);font-weight:600}

/* progress (tricolor: blue = done, orange = selected/not done, grey track = remaining) */
.progress{height:14px;background:var(--line);border-radius:20px;overflow:hidden;margin-top:8px;display:flex}
.progress .seg-done{height:100%;background:linear-gradient(90deg,var(--brand),#3b82f6);transition:width .5s ease}
.progress .seg-sel{height:100%;background:linear-gradient(90deg,#f59e0b,#fb923c);transition:width .5s ease}
.progress .bar{height:100%;background:linear-gradient(90deg,var(--brand),#3b82f6);transition:width .5s ease}
.progress .bar.done{background:linear-gradient(90deg,var(--green),#22c55e)}
.progress-label{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-top:6px;font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:16px;margin-top:12px;font-size:12.5px;color:var(--muted);font-weight:600}
.legend-item{display:inline-flex;align-items:center;gap:6px}
.legend .dot{width:11px;height:11px;border-radius:3px;flex:none}
.legend .dot-done{background:var(--brand)}
.legend .dot-sel{background:#f59e0b}
.legend .dot-rem{background:var(--line2)}

/* pills / chips */
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:20px;font-size:12px;font-weight:600}
.tag-dot{width:10px;height:10px;border-radius:50%;flex:none}

/* tables */
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);
  padding:10px 12px;border-bottom:2px solid var(--line)}
td{padding:11px 12px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--surface2)}

/* activity type card */
.act-type{border:1px solid var(--line);border-radius:var(--radius-sm);margin-bottom:10px;transition:.13s;overflow:hidden}
.act-type:hover{box-shadow:var(--shadow)}
.act-type.is-open{border-color:var(--brand);box-shadow:var(--shadow)}
.act-type-head{display:flex;align-items:center;gap:13px;padding:13px 15px;cursor:pointer}
.act-type-head:hover{background:var(--bg-soft,#f7f8fa)}
.act-caret{color:var(--muted);font-size:12px;margin-left:2px}
.act-type-body{padding:4px 15px 15px;border-top:1px dashed var(--line);background:var(--bg-soft,#fafbfc)}
.detail-block{margin-top:12px}
.detail-label{font-size:11px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:var(--brand);margin-bottom:4px}
.detail-text{font-size:13.5px;color:var(--text,#1a1a1a);margin:0;line-height:1.5;white-space:pre-wrap}
.ev-instr-list{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.ev-instr-list li{display:flex;flex-direction:column;gap:2px;padding:8px 10px;background:#fff;border:1px solid var(--line);border-radius:8px}
.ev-instr-list .ev-tag{font-size:11.5px;font-weight:700;color:var(--muted)}
.ev-instr-list .ev-instr{font-size:13.5px;color:var(--text,#1a1a1a);line-height:1.45;white-space:pre-wrap}
.act-type .swatch{width:38px;height:38px;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:15px}
.act-type .info{flex:1;min-width:0}
.act-type .info .n{font-weight:700;font-size:14.5px}
.act-type .info .h{font-size:12.5px;color:var(--muted)}

/* event cards */
.event-card{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:16px;background:var(--surface);box-shadow:var(--shadow);transition:.15s}
.event-card:hover{box-shadow:var(--shadow-lg);transform:translateY(-1px)}
.event-top{padding:16px 18px;display:flex;gap:15px;align-items:flex-start;border-bottom:1px solid var(--line)}
.event-date{background:var(--brand-light);color:var(--brand-dark);border-radius:12px;padding:8px 4px;width:60px;text-align:center;flex:none}
.event-date .d{font-size:22px;font-weight:800;line-height:1}
.event-date .m{font-size:11px;font-weight:700;text-transform:uppercase;margin-top:2px}
.event-top .meta{flex:1;min-width:0}
.event-top .meta h4{font-size:17px;font-weight:800}
.event-top .meta .sub{font-size:13px;color:var(--muted);margin-top:3px;display:flex;gap:14px;flex-wrap:wrap}
.event-badge{font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px}
.badge-up{background:var(--green-light);color:#166534}
.badge-past{background:var(--line);color:var(--muted)}
.event-body{padding:8px 18px 16px}
/* category */
.cat-badge{background:#ede9fe;color:#5b21b6;font-weight:700;padding:2px 9px;border-radius:20px;font-size:12px}
/* role toggle + children */
.role-toggle{display:flex;gap:0;margin-bottom:16px;border:1px solid var(--line2);border-radius:10px;overflow:hidden}
.role-opt{flex:1;padding:10px;border:none;background:var(--surface);cursor:pointer;font-size:14px;font-weight:600;color:var(--muted);transition:all .2s}
.role-opt.active{background:var(--brand);color:#fff}
.children-help{font-size:12px;color:var(--muted);margin-bottom:8px}
.children-list{display:flex;flex-direction:column;gap:6px;max-height:160px;overflow-y:auto;border:1px solid var(--line);border-radius:8px;padding:8px}
.child-opt{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;cursor:pointer;font-size:14px}
.child-opt:hover{background:var(--bg)}
.child-opt input{width:16px;height:16px;cursor:pointer}
.parent-badge{background:#dcfce7;color:#166534;font-weight:700;padding:2px 9px;border-radius:20px;font-size:12px}
.cat-select{padding:6px 8px;border:1px solid var(--line2);border-radius:8px;font-size:13px;background:var(--surface);cursor:pointer}
.cat-select:hover{border-color:var(--brand)}

/* need row */
.need{padding:14px 0;border-bottom:1px solid var(--line)}
.need:last-child{border-bottom:none}
.need-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.need-head .swatch{width:30px;height:30px;border-radius:8px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:12px}
.need-head .n{font-weight:700;font-size:14.5px}
.need-head .cap{font-size:12.5px;color:var(--muted);font-weight:600}
.need-head .hrs{font-size:11.5px;font-weight:700;color:var(--amber);background:var(--amber-light);padding:2px 8px;border-radius:20px}
.slots{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.slot{display:flex;align-items:center;gap:8px;background:var(--green-light);border:1px solid #bbf7d0;border-radius:20px;padding:4px 12px 4px 4px;font-size:13px;font-weight:600;color:#166534}
.slot.empty{background:var(--surface2);border:1px dashed var(--line2);color:var(--muted2);padding:5px 14px;font-weight:600}
.slot .av{width:26px;height:26px;font-size:10.5px}
.waitlist{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.waitlist .lbl{font-size:12px;color:var(--muted);font-weight:600}
.wl-circle{width:30px;height:30px;border-radius:50%;background:var(--surface);border:2px solid var(--line2);
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--muted);position:relative;cursor:default}
.wl-circle.mine{border-color:var(--amber);color:var(--amber);background:var(--amber-light)}
.wl-circle .pos{position:absolute;top:-6px;right:-6px;background:var(--muted);color:#fff;font-size:9px;font-weight:700;width:15px;height:15px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.need-actions{margin-top:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.need-note{font-size:12px;color:var(--muted);font-style:italic}
.mine-flag{font-size:11.5px;font-weight:700;color:var(--green);background:var(--green-light);padding:3px 9px;border-radius:20px}

/* modal */
.modal-back{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;animation:fade .15s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:var(--surface);border-radius:18px;box-shadow:var(--shadow-lg);width:100%;max-width:540px;max-height:90vh;overflow:auto;animation:pop .25s}
.modal-head{padding:20px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.modal-head h3{font-size:18px;font-weight:800}
.modal-head .x{font-size:22px;color:var(--muted2);width:34px;height:34px;border-radius:8px}
.modal-head .x:hover{background:var(--surface2);color:var(--text)}
.modal-body{padding:22px}
.modal-foot{padding:16px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}
.row-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}

/* need builder */
.need-builder{display:flex;gap:8px;align-items:flex-end;margin-bottom:10px;flex-wrap:wrap}
.need-builder .field{margin-bottom:0}
.need-chip{display:flex;align-items:center;gap:9px;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:8px}
.need-chip .swatch{width:26px;height:26px;border-radius:7px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:11px}
.need-chip .t{flex:1;font-size:13.5px;font-weight:600}
.need-chip .x{color:var(--red);font-weight:700;font-size:16px;padding:2px 8px;border-radius:6px}

.empty-state{text-align:center;padding:44px 20px;color:var(--muted)}
.empty-state .em{font-size:40px;margin-bottom:10px}
.color-picker{display:flex;gap:8px;flex-wrap:wrap}
.color-opt{width:32px;height:32px;border-radius:9px;cursor:pointer;border:3px solid transparent;transition:.1s}
.color-opt.sel{border-color:var(--text);transform:scale(1.08)}
.switch-line{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}
.switch-line:last-child{border-bottom:none}
.switch-line .t{font-weight:600;font-size:14px}
.switch-line .d{font-size:12.5px;color:var(--muted);margin-top:2px;max-width:340px}
.toggle{width:46px;height:26px;background:var(--line2);border-radius:20px;position:relative;transition:.2s;flex:none}
.toggle.on{background:var(--brand)}
.toggle::after{content:"";position:absolute;width:20px;height:20px;background:#fff;border-radius:50%;top:3px;left:3px;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle.on::after{left:23px}
.seg{display:inline-flex;background:var(--surface2);border-radius:10px;padding:3px;border:1px solid var(--line)}
.seg button{padding:7px 14px;border-radius:8px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button.active{background:#fff;color:var(--brand);box-shadow:var(--shadow)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--bg);color:#fff;
  padding:13px 22px;border-radius:12px;font-size:14px;font-weight:600;box-shadow:var(--shadow-lg);z-index:200;animation:toastin .3s}
@keyframes toastin{from{opacity:0;transform:translateX(-50%) translateY(12px)}to{opacity:1;transform:translateX(-50%)}}
.toast.err{background:var(--red)}
.toast.ok{background:var(--green)}

@media(max-width:820px){
  .layout{flex-direction:column}
  .sidebar{width:100%;display:flex;gap:6px;overflow-x:auto;padding:12px;border-bottom:1px solid var(--line)}
  .nav-item{width:auto;white-space:nowrap;margin-bottom:0}
  .nav-item span.txt{display:inline}
  .grid-3,.grid-2{grid-template-columns:1fr}
  .row-2{grid-template-columns:1fr}
  .content{padding:18px 14px 50px}
}
/* ===== Journalisation : console flottante + vue Journal ===== */
.log-toggle{position:fixed;right:18px;bottom:18px;z-index:900;width:48px;height:48px;border-radius:50%;border:none;
  background:var(--brand);color:#fff;font-size:22px;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.25);transition:transform .15s}
.log-toggle:hover{transform:scale(1.08)}
.log-toggle.active{background:#111827}
.log-console{position:fixed;right:18px;bottom:78px;z-index:900;width:min(560px,calc(100vw - 36px));height:min(460px,60vh);
  background:#0b1220;color:#e5e7eb;border-radius:14px;box-shadow:0 18px 50px rgba(0,0,0,.5);display:flex;flex-direction:column;overflow:hidden;border:1px solid #1f2937}
.log-console.hidden{display:none}
.logc-head{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#111827;border-bottom:1px solid #1f2937;flex-wrap:wrap}
.logc-head b{font-size:13px}
.logcount{font-size:11px;color:#9ca3af;font-family:ui-monospace,Menlo,monospace}
.logc-actions{margin-left:auto;display:flex;align-items:center;gap:6px}
.logsearch{background:#0b1220;border:1px solid #374151;color:#e5e7eb;border-radius:7px;padding:4px 9px;font-size:12px;outline:none}
.logsearch.grow{flex:1;min-width:120px}
.btn.tiny{padding:3px 8px;font-size:11px;border-radius:6px}
.btn.tiny.ghost{background:transparent;border:1px solid #374151;color:#cbd5e1}
.logc-filters{display:flex;gap:6px;padding:8px 12px;flex-wrap:wrap;border-bottom:1px solid #1f2937}
.logchip{background:#1f2937;border:1px solid #374151;color:#cbd5e1;border-radius:20px;padding:3px 10px;font-size:11px;cursor:pointer}
.logchip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.logc-body{flex:1;overflow:auto;padding:6px 0;font-family:ui-monospace,Menlo,Consolas,monospace}
.logrow{display:grid;grid-template-columns:76px 22px 1fr;gap:6px;align-items:start;padding:4px 12px;border-bottom:1px solid rgba(255,255,255,.04);font-size:11.5px}
.logrow:hover{background:rgba(255,255,255,.03)}
.logtime{color:#6b7280}
.logcat{text-align:center}
.logmsg{color:#e5e7eb;word-break:break-word}
.logdur{color:#fbbf24;font-weight:600}
.logwho{color:#60a5fa}
.logdata{grid-column:3;margin:2px 0 0;color:#94a3b8;white-space:pre-wrap;word-break:break-word;font-size:10.5px;background:rgba(255,255,255,.03);padding:3px 6px;border-radius:5px}
.logrow.lv-error .logmsg{color:#fca5a5}
.logrow.lv-warn .logmsg{color:#fcd34d}
.logrow.lv-success .logmsg{color:#86efac}
.logempty{padding:20px;text-align:center;color:#6b7280;font-size:12px}
/* Vue Journal (coach) */
.logs-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap}
.logs-actions{display:flex;gap:8px;flex-wrap:wrap}
.logfilters-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.logfilters-row .logchip{background:#eef2f7;border:1px solid #dbe3ec;color:#475569}
.logfilters-row .logchip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.loglevel{border:1px solid #dbe3ec;border-radius:8px;padding:5px 9px;font-size:13px;background:#fff}
.logfilters-row .logsearch{background:#fff;border:1px solid #dbe3ec;color:#111827}
.logtable{width:100%;border-collapse:collapse;font-size:12.5px}
.logtable th{text-align:left;padding:8px 10px;background:#f8fafc;border-bottom:2px solid #e5e7eb;font-weight:700;position:sticky;top:0;white-space:nowrap}
.logtable td{padding:7px 10px;border-bottom:1px solid #eef2f7;vertical-align:top}
.logtable tr.lv-error{background:#fef2f2}
.logtable tr.lv-warn{background:#fffbeb}
.logtable .mono{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:#475569}
.logtable .nowrap{white-space:nowrap}
.loglvl{display:inline-block;padding:1px 8px;border-radius:12px;font-size:10.5px;font-weight:700;text-transform:uppercase;background:#e5e7eb;color:#374151}
.loglvl.lv-error{background:#fee2e2;color:#b91c1c}
.loglvl.lv-warn{background:#fef3c7;color:#92400e}
.loglvl.lv-success{background:#dcfce7;color:#15803d}
.loglvl.lv-info{background:#dbeafe;color:#1d4ed8}
.logdata.big{max-width:340px;white-space:pre-wrap;word-break:break-word;margin:0;color:#64748b;font-size:11px}
.chip.tiny{padding:1px 7px;font-size:10px}
.tablewrap{overflow:auto;max-height:60vh}
</style>
</head>
<body>

<!-- ============ AUTH SCREEN ============ -->
<div id="authScreen">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="ball"></div>
      <h1 data-i18n="appName">Bénévolat FC</h1>
    </div>
    <div class="auth-sub" data-i18n="appTagline">Gestion des heures de bénévolat de l'équipe</div>
    <div class="tabs">
      <button id="tabLogin" class="active" onclick="setAuthTab('login')" data-i18n="login">Connexion</button>
      <button id="tabSignup" onclick="setAuthTab('signup')" data-i18n="signup">Inscription</button>
      <button id="tabActivate" onclick="setAuthTab('activate')" data-i18n="activateTab">Activer un compte</button>
    </div>
    <div id="authError" class="auth-err hidden"></div>

    <!-- login form -->
    <form id="loginForm" onsubmit="return doLogin(event)">
      <div class="field">
        <label data-i18n="email">Courriel</label>
        <input type="email" id="loginEmail" required placeholder="joueur@equipe.ca">
      </div>
      <div class="field">
        <label data-i18n="password">Mot de passe</label>
        <input type="password" id="loginPass" required placeholder="••••••••">
      </div>
      <button class="btn btn-primary btn-block" type="submit" data-i18n="loginBtn">Se connecter</button>
    </form>

    <!-- signup form -->
    <form id="signupForm" class="hidden" onsubmit="return doSignup(event)">
      <div class="role-toggle">
        <button type="button" id="suRolePlayer" class="role-opt active" onclick="setSignupRole('player')" data-i18n="iAmPlayer">Je suis un joueur</button>
        <button type="button" id="suRoleParent" class="role-opt" onclick="setSignupRole('parent')" data-i18n="iAmParent">Je suis un parent</button>
      </div>
      <div class="row-2">
        <div class="field"><label data-i18n="firstName">Prénom</label><input id="suFirst" required></div>
        <div class="field"><label data-i18n="lastName">Nom</label><input id="suLast" required></div>
      </div>
      <div class="field"><label data-i18n="email">Courriel</label><input type="email" id="suEmail" required></div>
      <div class="field" id="suCategoryField"><label data-i18n="playerCategory">Catégorie du joueur</label><select id="suCategory"></select></div>
      <div class="field hidden" id="suChildrenField"><label data-i18n="myChildren">Mon/mes enfant(s)</label>
        <div class="children-help" data-i18n="childrenHelp">Cochez le(s) joueur(s) dont vous êtes le parent.</div>
        <div id="suChildren" class="children-list"></div>
      </div>
      <div class="field"><label data-i18n="password">Mot de passe</label><input type="password" id="suPass" required minlength="4"></div>
      <button class="btn btn-primary btn-block" type="submit" id="suBtn" data-i18n="signupBtn">Créer mon compte joueur</button>
      <div class="auth-foot" data-i18n="signupNote">Les nouveaux comptes sont créés comme joueurs.</div>
    </form>

    <!-- activate account (invited players) -->
    <form id="activateForm" class="hidden" onsubmit="return doActivate(event)">
      <div class="auth-foot" style="margin:0 0 12px" data-i18n="activateHelp">Entrez le courriel fourni par votre coach et choisissez votre mot de passe.</div>
      <div class="field"><label data-i18n="email">Courriel</label><input type="email" id="acEmail" required placeholder="joueur@equipe.ca"></div>
      <div class="field"><label data-i18n="inviteCode">Code d'invitation</label><input id="acCode" placeholder="(optionnel si courriel reconnu)"></div>
      <div class="field"><label data-i18n="password">Mot de passe</label><input type="password" id="acPass" required minlength="4"></div>
      <div class="field"><label data-i18n="confirmPasswordLabel">Confirmer le mot de passe</label><input type="password" id="acPass2" required minlength="4"></div>
      <button class="btn btn-primary btn-block" type="submit" data-i18n="activateBtn">Activer et se connecter</button>
    </form>

    <div class="demo-hint" id="demoHint"></div>
    <div class="lang-switch">
      <button id="langFr" class="active" onclick="setLang('fr')">Français</button>
      <button id="langEn" onclick="setLang('en')">English</button>
    </div>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app" class="hidden">
  <div class="topbar">
    <div class="ball"></div>
    <div class="brand" data-i18n="appName">Bénévolat FC</div>
    <span id="roleBadge" class="role-badge"></span>
    <div class="spacer"></div>
    <button class="icon-btn" onclick="toggleLang()" id="langBtn">EN</button>
    <div class="user-chip">
      <div class="avatar" id="myAvatar"></div>
      <span id="myName"></span>
    </div>
    <button class="icon-btn" onclick="logout()" data-i18n="logout">Déconnexion</button>
  </div>
  <div class="layout">
    <div class="sidebar" id="sidebar"></div>
    <div class="content" id="content"></div>
  </div>
  <!-- Console de journalisation flottante -->
  <button id="logToggle" class="log-toggle" title="Console du journal" onclick="LOG.toggleConsole()">📜</button>
  <div id="logConsole" class="log-console hidden"></div>
</div>

<div id="modalRoot"></div>
<div id="toastRoot"></div>

<!-- Persistance Supabase (optionnelle) : si config.js contient des clés, l'app passe en mode cloud + temps réel ; sinon repli localStorage. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase/config.js"></script>
<script src="supabase/data.js"></script>
<script src="app.js"></script>
</body>
</html>
